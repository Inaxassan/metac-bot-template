name: Assay ledger
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: assay-ledger
  cancel-in-progress: true

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned from v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned from v5
        with:
          python-version: "3.11"
      - name: Pull forecasts and resolutions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          pip install requests --quiet
          python -u assay_pull.py
      - name: Commit ledger if changed
        run: |
          git config user.name "assay-ledger[bot]"
          git config user.email "actions@github.com"
          git pull --rebase --autostash
          git add assay/ledger.json
          git diff --cached --quiet && echo "no change" || (git commit -m "assay ledger update" && git push)
