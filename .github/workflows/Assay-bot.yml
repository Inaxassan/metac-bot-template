name: Assay bot
# ADOPT 2026-10-08: hourly cadence (FutureEval windows ~3h) + workflow_dispatch
# mode input (test_questions = the venue's drill arena, one click).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run mode (test_questions = venue drill arena)"
        required: true
        default: "tournament"
        type: choice
        options:
          - tournament
          - metaculus_cup
          - test_questions
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: assay-bot
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned from v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned from v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet forecasting-tools python-dotenv requests
      - name: Run ASSAY-Bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          METACULUS_API_KEY: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
        run: python -u main.py --mode ${{ inputs.mode || 'tournament' }}
      - name: Commit any local report artifacts
        run: |
          git config user.name "assay-bot[bot]"
          git config user.email "actions@github.com"
          git pull --rebase --autostash
          git add -A
          git diff --cached --quiet && echo "no change" || (git commit -m "assay-bot run artifacts" && git push)
