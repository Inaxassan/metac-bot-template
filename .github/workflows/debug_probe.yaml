name: Debug API probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Metaculus API
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          pip install requests --quiet
          python - <<'PYEOF'
          import os, requests
          H = {"Authorization": "Token " + os.environ["METACULUS_TOKEN"]}
          B = "https://www.metaculus.com/api"
          r = requests.get(B + "/posts/", params={"tournaments": ["33121"], "limit": 100}, headers=H, timeout=60)
          posts = r.json().get("results", [])
          print("total posts:", len(posts))
          for p in posts:
              kind = "question" if "question" in p else ("group" if "group_of_questions" in p else ("notebook" if "notebook" in p else "?"))
              q = p.get("question") or {}
              print("-", p.get("id"), "| post_status:", p.get("status"), "|", kind, "|", (p.get("title") or "?")[:45])
              print("   q_status:", q.get("status"), "| open:", q.get("open_time"), "| close:", q.get("scheduled_close_time"), "| forecasters:", q.get("nr_forecasters"))
              if kind == "group":
                  subs = p["group_of_questions"].get("questions", [])
                  print("   group with", len(subs), "subquestions")
                  for sq in subs[:3]:
                      print("   sub:", sq.get("id"), "|", sq.get("status"), "|", (sq.get("title") or "?")[:40], "| open:", sq.get("open_time"))
          PYEOF
